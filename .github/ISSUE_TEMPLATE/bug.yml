name: Bug report
description: Something in the extension or site is broken.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 129 on Windows 11
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider
      description: TypeSafe or OpenRouter.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console errors, screenshots, or other context.
    validations:
      required: false
